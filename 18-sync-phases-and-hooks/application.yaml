apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-sync-and-hooks-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anuroopps2001/argocd.git
    targetRevision: HEAD  # asking argocd to look into the latest git commit apply the manifests of that commit
    path: 18-sync-phases-and-hooks/k8s-manifest-files 
  destination:
    server: https://kubernetes.default.svc
    namespace: default
