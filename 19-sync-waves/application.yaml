apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-syncwaves
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anuroopps2001/argocd.git
    targetRevision: HEAD  # asking argocd to look into the latest git commit apply the manifests of that commit
    path: 19-sync-waves/k8s-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
