apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-sync-and-hooks-deployment
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - image: gcr.io/google-samples/gb-frontend:v5
          name: guestbook-ui
          ports:
            - containerPort: 80
